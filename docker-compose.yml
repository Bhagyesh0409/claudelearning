# Phase 1: web (nginx serving the built React site) + ngrok tunnel.
# Phase 2/3 services (api, db) are sketched at the bottom. See decisions/0003.
#
#   docker compose up --build -d     # start everything
#   docker compose up --build web    # local only, no tunnel (no ngrok token needed)

services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-static}
    image: portfolio-web:latest
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:3-alpine
    # Uses the static domain when NGROK_DOMAIN is set in .env, otherwise a random URL.
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec ngrok http web:80 --log stdout $${NGROK_DOMAIN:+--url=https://$$NGROK_DOMAIN}']
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-} # set in .env (see .env.example)
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}       # e.g. yourname.ngrok-free.app (decisions/0009)
    ports:
      - "4040:4040" # ngrok inspector: http://localhost:4040 shows the public URL
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

