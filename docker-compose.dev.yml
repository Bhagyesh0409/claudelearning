# Hot-reload dev server without a local Node install (decisions/0007).
#   docker compose -f docker-compose.dev.yml up
#   → http://localhost:5173  (edits in ./frontend/src reload live)

services:
  dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules # keep Linux node_modules out of the Windows folder
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true" # file-change detection through Windows bind mounts

volumes:
  frontend_node_modules:
